overlay: 1.0.0
info:
  title: API Evangelist enhancements for the aicomglobal API
  version: 1.0.0
extends: ../openapi/aicomglobal-com-openapi.json
x-generated: '2026-09-19'
x-method: generated
x-source: >-
  Generated from openapi/aicomglobal-com-openapi.json plus the probed and searched artifacts in this repo
  (agent card, llms.txt, live 401/402/405 responses, GET /svc, /verdict/sample). Captures API Evangelist
  annotations without mutating the provider's contract. Proposed securitySchemes, tags and response shapes are
  marked as proposals; they do not exist in the provider's spec.
actions:
