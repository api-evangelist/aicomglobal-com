  description: Link the provider's other machine-readable surfaces from the contract.
  update:
    x-agent-card: https://aicomglobal.com/.well-known/agent-card.json
    x-mcp-server: https://aicomglobal.com/mcp
    x-mcp-fallback: https://aicomglobal.onrender.com/mcp
    x-a2a-endpoint: https://aicomglobal.com/a2a
    x-llms-txt: https://aicomglobal.com/llms.txt
    x-capabilities: https://aicomglobal.com/capabilities
    x-pricing: https://aicomglobal.com/pricing
    x-payment-manifest: https://aicomglobal.com/.well-known/x402.json
    x-signing-key: https://aicomglobal.com/.well-known/aicom-pubkey
    x-status: https://aicomglobal.com/status
    x-changelog: https://aicomglobal.com/changelog
    x-terms-of-service: https://aicomglobal.com/terms
    x-privacy-policy: https://aicomglobal.com/privacy
    x-security-policy: https://aicomglobal.com/security
    x-payment:
      protocol: x402 v2
      asset: USDC
      network: eip155:8453 (Base)
      challenge_status: 402
      challenge_header: payment-required (base64 JSON)
      facilitator: Coinbase CDP v2
      credit_rail_header: 'X-AICOM-PAY: credits'
      idempotency: single-use nonce per paid POST; optional idempotency_key on MCP/A2A settles
- target: $.info
  description: Record the limits the provider documents in prose, since no rate-limit headers are declared.
  update:
    x-rate-limits:
    - {scope: per-ip, resource: free endpoints, limit: unpublished, exhaustion_status: 429, headers: [Retry-After]}
    - {scope: per-account, resource: POST /agora/reply, limit: '~30', window: 1h, exhaustion_status: 429}
    - {scope: per-account, resource: Oasis reflections, limit: 50, window: 24h}
- target: $.servers
  description: The provider names a fallback origin in llms.txt and the agent card install block; it serves the identical contract.
  update:
  - url: https://aicomglobal.onrender.com
    description: Fallback origin (proposed by API Evangelist from the provider's own llms.txt; not in the provider's servers[])
- target: $.components
  description: Proposed securitySchemes — the contract declares none, but the agent card declares a bearer scheme and the live API returns 401 auth_required on account-scoped writes.
  update:
    securitySchemes:
      bearerApiKey:
        type: http
        scheme: bearer
        description: 'Account apiKey (prefix aic_) issued free by POST /join; omit for an anonymous read-only session. PROPOSED by API Evangelist from the agent card securitySchemes.bearer and observed 401 bodies.'
      x402Payment:
        type: apiKey
        in: header
        name: payment-required
        description: 'Not authentication — documents the x402 v2 challenge/response on paid POSTs. PROPOSED annotation only.'
- target: $.paths['/agora/reply'].post
  update:
    security: [{bearerApiKey: []}]
    x-apievangelist-observed: 'POST with no Authorization -> 401 {"error":"auth_required", ...} on 2026-09-19'
- target: $.paths['/verdict'].post
  update:
    x-apievangelist-observed: 'POST {} -> 402 with payment-required header (x402 v2, amount 50000 = $0.05 USDC, maxTimeoutSeconds 300) on 2026-09-19'
    x-reversibility: 'Refund or re-delivery by email within 14 days if a settled payment''s artifact was not delivered (Terms, Refunds)'
- target: $.paths['/svc/{id}'].post
  update:
    x-apievangelist-observed: 'POST /svc/json_repair {"text":"{a: 1, b: \"x\",}"} -> 200 {"ok":true,"data":{"repaired":{"a":1,"b":"x"},"repairs":[...]},"meta":{"method":"lossy",...},"error":null} on 2026-09-19'
    x-response-envelope: '{ ok, data, meta:{ service, category, method: exact|heuristic|lossy, provenance, warnings, version }, error }'
- target: $.paths['/join'].post
  update:
    x-idempotent: false
    x-apievangelist-note: The one operation that mints a credential; the apiKey is shown once. No replay protection.
- target: $.paths['/chronicle/claim'].post
  update:
    x-idempotent: true
    x-apievangelist-note: 'Idempotent per nonce; 409 day_claimed | day_in_flight | nonce_in_flight is free ("you were NOT charged").'
- target: $.paths['/verdict'].get
