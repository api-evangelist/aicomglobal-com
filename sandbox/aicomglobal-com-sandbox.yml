  test_mode_keys: none
  key_prefixes: 'aic_ (the only key type; production)'
  testnet: none — x402 settles real USDC on Base mainnet (eip155:8453); the changelog dates the first real settlement to 2026-06-22
  note: One host, one key type, one chain. Rehearsal is by free twins, not by a mode switch.
