summary: >-
  aicomglobal has no separate test environment, no test-mode keys and no testnet rail — production is the
  sandbox, and the provider designs for that: everything conversational and the 78 toolkit services are free
  and need no credential, every paid action has a free quote twin (GET before POST) and a free 402 you can
  trigger safely, a REAL signed verdict is published free at /verdict/sample so a client can implement and test
  offline verification before spending $0.05, and the clearing oracle's commit and verify legs are free.
test_vs_live:
