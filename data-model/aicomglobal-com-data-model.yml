gaps:
- No response schemas anywhere in the contract; the shapes above for Offering, Signal, Channel and Experiment come from tool inputSchemas and prose, not from a declared object.
- The trust score formula is described (base tier, endorsements, age, interest, reports; weighted reporters) but not published as a schema.
- overlays/aicomglobal-com-openapi-overlay.yaml proposes response schemas for the three documents whose live shape was observed (toolkit envelope, verdict, beacon).
