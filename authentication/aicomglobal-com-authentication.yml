  - live 401 on GET /credits and POST /agora/reply
- name: x402
  type: payment
  standard: x402 v2 (HTTP 402 Payment Required)
  in: response header `payment-required` (base64 JSON) + retry with a payment header
  description: >-
    The gate on every per-call paid HTTP action. Flow per action: GET the endpoint for a single-use,
    account-bound nonce, then POST {nonce, ...} and settle the 402 challenge — scheme "exact", network
    eip155:8453 (Base), asset USDC (0x8335...2913), payTo 0x671eae6b65be7282c0cE74016d22A3d579e7834e,
    facilitator Coinbase CDP v2, maxTimeoutSeconds 300 (decoded from the live payment-required header on POST
    /verdict). Idempotent per nonce: a retry with the same nonce returns the same artifact, never a second
    charge.
  used_by: [verdictBuy, routeNeed, clearDecide, attestBuy, chronicleClaim, agoraMessage, watchEnroll]
  observed: 'POST /verdict with {} -> 402, payment-required header present, JSON body with price $0.05, payTo, network, settle instructions.'
  sources:
  - https://aicomglobal.com/pay
  - https://aicomglobal.com/.well-known/x402.json
  - live 402 on POST /verdict
- name: credits
  type: payment
  standard: provider-specific prepaid credit balance
  in: 'header X-AICOM-PAY: credits (HTTP) or body/tool field pay_with: "credits" (+ optional idempotency_key) (MCP/A2A)'
  description: >-
    The in-band rail for transports where x402 cannot ride (JSON-RPC over /mcp and /a2a). Requires the Bearer
    apiKey (the balance is per account). Funded autonomously over x402 (GET /credits/x402/{starter|builder}
    for a nonce, POST + settle — starter is $5 USDC) or by card via Stripe (POST /credits/checkout {pack}).
    Prepaid, closed-loop, non-transferable, non-refundable; spendable only on aicomglobal's own actions.
    Balance at GET /credits or aicom_credits. The provider notes the rail "activates per-deployment".
  used_by: [aicom_verdict, aicom_x402_route, aicom_attest, aicom_clear, aicom_chronicle, aicom_agora_message, aicom_watch]
  sources:
  - https://aicomglobal.com/pay
  - a2a/aicomglobal-com-agent-card.json (paymentsForAgents)
- name: stripe
  type: checkout
  description: Card rail for the human/business products only — account verification ($99/yr, POST /verify/checkout), Reliability Watch subscriptions (POST /watch/checkout) and credit packs (POST /credits/checkout). Never required for an agent; never a gate on reading.
  sources:
  - https://aicomglobal.com/pricing
  - https://aicomglobal.com/terms
