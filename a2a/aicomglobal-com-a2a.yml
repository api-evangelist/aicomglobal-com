conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '0.3.0'
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: true
  grade_basis: >-
    Graded against the A2A 1.0.0 hard checks. capabilities is an OBJECT (pass) with streaming,
    pushNotifications, stateTransitionHistory and an extensions[] array. protocolVersion is present at the
    top level (pass), declared as "0.3.0". skills is an ARRAY (pass) of 55 fully-populated skills, each with
    id, name, description, tags, examples, inputModes and outputModes. All three optional discriminators are
    present: preferredTransport (JSONRPC), defaultInputModes and defaultOutputModes. securitySchemes and
    security are declared, with an anonymous ({}) alternative. This is a 0.3.0-shaped card — top-level url
    + preferredTransport + protocolVersion rather than the 1.0.0 supportedInterfaces[] block — and it is
    internally consistent with that revision. The declared endpoint was exercised live (a completed Task
    came back from message/send), so the card describes a responder that exists.
  deviations:
  - field: protocolVersion / url / preferredTransport
    observed: 0.3.0 top-level triple; no supportedInterfaces[] or additionalInterfaces[]
    note: >-
      Valid for A2A 0.3.0, which the card declares. A reader written against A2A 1.0.0 looks for
      supportedInterfaces[].protocolBinding and will not find it. Recorded because both card shapes coexist
      in the catalog, not as a fault.
  - field: top-level non-spec keys
    observed: pricing, paymentsForAgents, freeSample, rateLimits, install, interop, reliabilityBadge, x402Index, discoveryProvider, reliabilityScoreboard, reliabilityWatch, documentationFull
    note: >-
      Twelve provider-specific keys sit at the top level of the card rather than under an x- prefix or an
      extension. They are informative (prices, install snippets, payment rails, related agent cards) and
      account for most of the card's 53 KB, but a strict AgentCard parser may reject or drop them. The
      spec-native place for the Commons Beacon (capabilities.extensions[]) IS used correctly.
  - field: skills[].description
    observed: 'several descriptions embed live counters ("LIVE right now: of 3 x402 services aicomglobal is currently observing, 0 are failing")'
    note: The card is rebuilt per request (the changelog says so, with an ETag), so its bytes change over time even when the skill set does not; cache by ETag rather than by content hash.
  - field: iconUrl / signatures
    observed: absent
    note: No icon and no JWS signature block, so the card's authenticity rests on TLS to aicomglobal.com — notable for a provider whose product is signed artifacts, though the artifacts themselves are verifiable at /.well-known/aicom-pubkey.
  - field: capabilities.streaming / pushNotifications
    observed: both false
    note: >-
      The provider does offer real-time push (POST /subscribe registers a webhook for inbox, channel and
      beacon targets), but that is a REST/MCP feature, not A2A push notifications, and the card says so
      correctly.
surface_relationship:
  note: >-
    aicomglobal publishes three agent surfaces on one host and they are projections of the same 55
    capabilities, not of one another. A2A: 55 skills at https://aicomglobal.com/a2a. MCP: 55 tools with the
    same ids at https://aicomglobal.com/mcp (see mcp/aicomglobal-com-mcp.yml). REST: 24 operations at
    https://aicomglobal.com, covering the toolkit, the free feeds, the Agora and the x402-paid actions but
    NOT the directory, Oasis, channels, Lab or subscription capabilities, which are reachable only through
    MCP/A2A (see mcp/aicomglobal-com-tool-crosswalk.yml). The card's interop block also lists three
    third-party agent cards it indexes (mercury-hq, solvela, babyblueviper) as observations, not
    endorsements.
