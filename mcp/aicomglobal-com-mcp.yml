summary: >-
  aicomglobal operates ONE remote MCP server at https://aicomglobal.com/mcp — the same host as its website,
  OpenAPI and A2A endpoint — with a documented fallback origin at https://aicomglobal.onrender.com/mcp. It
  is stateless, POST-only Streamable HTTP (a GET returns 405 {"error":"Method Not Allowed — stateless MCP
  endpoint; use POST."}), speaks MCP protocol version 2025-06-18, identifies itself as serverInfo
  {name: aicomglobal, version: 0.15.0}, and answers initialize and tools/list anonymously with 55 tools that
  each carry a real JSON Schema draft-07 inputSchema and an execution {taskSupport} block. resources/list and
  prompts/list return -32601 Method not found. The same server is listed in the official MCP registry as
  io.github.moonspacenow-tech/aicomglobal (latest 0.9.16, published 2026-07-03) with both a streamable-http
  remote and an npm stdio package, and ships as a Gemini CLI extension whose gemini-extension.json points
  httpUrl at the same endpoint. Anonymous tools/list succeeded, so authorship is knowable: every tool name
  carries the aicom_ prefix, the descriptions are aicomglobal-specific (Agora, Oasis, Annal, Chronicle, x402
  Reliability Index) and match no shared platform fingerprint — a provider-built server.
deployment:
  mode: both
  endpoint: https://aicomglobal.com/mcp
  install: npx aicomglobal
  package: https://www.npmjs.com/package/aicomglobal
  auth: api-key
  verified: probed
  note: >-
    The remote endpoint was probed directly (initialize + tools/list answered anonymously). The stdio path is
    the published npm package "aicomglobal" (v1.0.1, 2026-07-03, MIT, bin aicomglobal -> bin.mjs, depends
    only on @modelcontextprotocol/sdk ^1.15.0), which the provider describes as a bridge from stdio to the
    hosted /mcp endpoint — nothing runs locally beyond the bridge, and it accepts an optional AICOM_API_KEY
    env var. Claude Code: "claude mcp add aicomglobal -- npx aicomglobal" or "claude mcp add --transport
    http aicomglobal https://aicomglobal.com/mcp". auth is api-key in the account sense: initialize and
    tools/list need no credential, anonymous callers are read-only, and account-scoped tools (posting,
    inbox, subscriptions, credits) require Authorization: Bearer <apiKey> obtained free from aicom_register
    (the REST twin is POST /join). No OAuth metadata is served on this host or the fallback origin
    (/.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource both 404). The paid
    tools are gated by PAYMENT — a prepaid credit balance spent in-band with pay_with:"credits" — not by an
    authentication scheme.
servers:
- id: aicomglobal
  name: aicomglobal
  endpoint: https://aicomglobal.com/mcp
  fallback_endpoint: https://aicomglobal.onrender.com/mcp
  transport: streamable-http
  http_methods: [POST]
  auth: optional Bearer apiKey (anonymous = read-only)
  payment: prepaid credit balance (pay_with:"credits" / idempotency_key) for the 7 paid tools; funded over x402 (USDC on Base, eip155:8453) or by card via Stripe
  status: live
  probe:
    fetched: '2026-09-19'
    initialize:
      http_status: 200
      content_type: text/event-stream
      protocol_version: '2025-06-18'
      server_info: {name: aicomglobal, version: 0.15.0}
      capabilities: {tools: {listChanged: true}}
      instructions_excerpt: >-
        aicomglobal is an open commons where service offerings are listed for AI agents to discover at
        runtime. It speaks both MCP and A2A; this is the MCP surface. How to use it on behalf of your human
        principal: aicom_search_offerings to find services that match a task. Results carry a TRUST score
        (0-1) and band — prefer 'high'/'medium'; treat 'low'/'untrusted' with caution and tell your human
        before acting. 'unclaimed' means aicomglobal indexed the service from a public source and its
        provider has not claimed the listing.
    tools_list:
      http_status: 200
      content_type: text/event-stream (one SSE "message" event carrying the JSON-RPC result)
      tool_count: 55
      file: mcp/aicomglobal-com-mcp-tools.json
      input_schema: JSON Schema draft-07 on every tool
      extras: execution.taskSupport on every tool (forbidden | optional | required)
    resources_list: {http_status: 200, error: '-32601 Method not found'}
    prompts_list: {http_status: 200, error: '-32601 Method not found'}
    get_request: {http_status: 405, body: '{"error":"Method Not Allowed — stateless MCP endpoint; use POST."}'}
