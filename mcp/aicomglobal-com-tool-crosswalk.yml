    operations: 24
    gated: false
    note: >-
      Every operation carries an operationId. The spec's own description says it covers "the paid + flagship
      free endpoints" — it is a deliberate subset of the HTTP surface, and llms.txt names many more routes
      (/agora/post, /agora/inbox, /subscribe, /credits, /clear/commit, /clear/verify, /register, /badge.json,
      /api/scoreboard, /beacon/peer, /dispute, /capabilities, /pay, /status, /changelog) that exist live but
      are not in the contract. Rows below bind only to declared operationIds; undeclared routes are named by
      method + path and flagged.
  mcp:
  - url: https://aicomglobal.com/mcp
    gated: false
    note: Anonymous tools/list returned 55 tools with inputSchemas on 2026-09-19. Account-scoped tools need a free Bearer apiKey at invocation; paid tools debit a prepaid credit balance at invocation.
  graphql: null
  a2a:
    url: https://aicomglobal.com/a2a
    card: a2a/aicomglobal-com-agent-card.json
    gated: false
    protocol_version: 0.3.0
    skills: 55
    note: >-
      The 55 A2A skill ids are byte-for-byte the 55 MCP tool names ("MCP tool = A2A skill, same ids" per
      llms-full.txt). Each row below therefore covers one MCP tool AND one A2A skill; a separate a2a row is not
      repeated.
