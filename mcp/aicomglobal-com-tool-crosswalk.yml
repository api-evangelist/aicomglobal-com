  category: toolkit
  rest: [listServices]
  binding: rest
  confidence: high
  note: Same 78-service catalog; verified live — the A2A message/send probe returned the identical body GET /svc returns.
- tool: aicom_describe_service
  category: toolkit
  rest: ['GET /svc/{id} (live 200, not declared in the spec)']
  binding: rest
  confidence: high
  note: GET /svc/json_repair returned id/title/category/method/usage/examples; the contract declares only GET /svc and POST /svc/{id}.
- tool: aicom_run_service
  category: toolkit
  rest: [runService]
  binding: rest
  confidence: high
  note: 'The MCP inputSchema {service_id | service, input} wraps the REST call where `input` IS the request body of POST /svc/{id}; the uniform envelope {ok, data, meta.method, error} is identical.'
- tool: aicom_x402_index
  category: reliability-index
  rest: [x402Index]
  binding: rest
  confidence: high
  note: MCP adds limit/sort parameters; GET /api/x402 documents "default 200, limit up to 2000".
- tool: aicom_verdict
  category: trust-verdict
  rest: [verdictQuote, verdictBuy]
  binding: rest
  confidence: high
  note: >-
    Without pay_with the tool returns the quote (verdictQuote); with pay_with:"credits" it settles from the
    prepaid balance and returns the signed verdict in-band, which is what verdictBuy does over HTTP after the
    x402 402 challenge. The idempotency_key on the tool plays the role the single-use nonce plays on REST.
- tool: aicom_x402_route
  category: router
  rest: [routeQuote, routeNeed]
  binding: rest
  confidence: high
  note: Same quote-then-settle pattern as aicom_verdict; `need` and `limit` are the routeNeed body fields.
- tool: aicom_attest
  category: attestation
  rest: [attestBuy, 'GET /oasis/attest (nonce; named in the spec description, not declared as a path)']
  binding: rest
  confidence: high
  note: '`body` is the statement; pay_with/idempotency_key replace the nonce.'
- tool: aicom_clear
  category: clearing-oracle
  rest: [clearDecide, 'POST /clear/commit (free; not declared)', 'GET /clear (nonce; not declared)', 'POST /clear/verify (free; not declared)']
  binding: composite
  confidence: medium
  note: >-
    The MCP tool takes no inputs and, per its description, returns the Lab-style pricing and step-by-step
    process; the paid decision itself is clearDecide over HTTP. GET /clear (live 200) documents the three-call
    flow commit -> attest -> verify, of which only /clear/attest is in the contract.
- tool: aicom_chronicle
  category: chronicle
  rest: [chronicleToday, chronicleClaim]
  binding: rest
  confidence: high
  note: The tool reads today's slot (chronicleToday); claiming the line is chronicleClaim over x402 (409 day_claimed | day_in_flight | nonce_in_flight when you lose the race — "you were NOT charged").
- tool: aicom_chronicle_read
  category: chronicle
  rest: [chronicleScroll]
  binding: rest
  confidence: high
  note: '`day` selects one day (the /chronicle/{day} permalink the spec mentions); no day = the scroll.'
- tool: aicom_register
