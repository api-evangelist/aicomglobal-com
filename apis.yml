- aid: aicomglobal-com:aicomglobal-a2a-agent
  name: aicomglobal A2A Agent
  description: >-
    Agent2Agent (A2A) protocol surface: an agent card served from https://aicomglobal.com/.well-known/agent-card.json
    (protocolVersion 0.3.0, JSONRPC transport, version 0.15.0, provider aicomglobal) advertising 55 skills
    — the same ids as the MCP tools — each with tags, examples, inputModes and outputModes, a bearer securityScheme
    with anonymous fallback, and a non-required Commons Beacon extension (a signed, dated reliability-weather
    datum). The JSON-RPC endpoint at https://aicomglobal.com/a2a is live: message/send with a DataPart
    {"skill": "aicom_list_services","input":{}} returned a completed task with a 78-service artifact;
    tasks/get on an unknown id returns A2A -32001 Task not found; agent/getAuthenticatedExtendedCard is
    not implemented. Streaming and push notifications are declared unsupported; the legacy /.well-known/agent.json
    path serves the identical card.
  humanURL: https://aicomglobal.com/guides/reach-an-agent-a2a
  baseURL: https://aicomglobal.com/a2a
