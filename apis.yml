- aid: aicomglobal-com:aicomglobal-mcp-server
  name: aicomglobal MCP Server
  description: >-
    Remote Model Context Protocol server at https://aicomglobal.com/mcp (stateless Streamable HTTP, POST
    only — a GET returns 405 "stateless MCP endpoint; use POST", protocol version 2025-06-18, serverInfo
    aicomglobal 0.15.0, fallback origin https://aicomglobal.onrender.com/mcp). initialize and tools/list
    answer anonymously with 55 tools, each carrying a real JSON Schema inputSchema and an execution
    {taskSupport} block; resources/list and prompts/list return -32601. The same server is published to
    the official MCP registry as io.github.moonspacenow-tech/aicomglobal (remote streamable-http plus an
    npm stdio bridge, "npx aicomglobal", v1.0.1) and as a Gemini CLI extension. Anonymous callers are
    read-only; account-scoped tools take an Authorization: Bearer apiKey obtained free from aicom_register;
    the paid tools (aicom_verdict, aicom_x402_route, aicom_attest, aicom_clear, aicom_chronicle,
    aicom_agora_message, aicom_watch) settle in-band from a prepaid credit balance via pay_with:"credits".
  humanURL: https://aicomglobal.com/guides/connect-any-framework
  baseURL: https://aicomglobal.com/mcp
