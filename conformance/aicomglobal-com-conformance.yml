summary: >-
  aicomglobal's conformance profile is the agent-protocol stack rather than any enterprise or sector
  standard: an A2A 0.3.0 agent card (graded conformant) whose JSON-RPC endpoint answered a real message/send,
  an MCP server at protocol version 2025-06-18 registered in the official MCP registry, JSON-RPC 2.0 on both,
  x402 v2 payment (observed live: HTTP 402 with a base64 payment-required header) settled in USDC on Base
  (CAIP-2 eip155:8453), an x402 v2 discovery manifest at /.well-known/x402.json plus a Bazaar-compatible
  discovery feed, Ed25519 signatures over every sold artifact with a published SPKI/PEM key history, RFC 8288
  Link rel="describedby" on every response, and an ERC-8004-shaped dataHash on verdicts (self-declared). It
  declares no OAuth/OIDC, no RFC 9457 problem details, no RFC 9116 security.txt, no RFC 9727 API catalog and
  no RFC 8594 deprecation signalling.
