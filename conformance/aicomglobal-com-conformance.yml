- id: x402
  name: x402 HTTP payment protocol
  version: v2
  conforms: true
  verification: observed
  evidence: >-
    POST https://aicomglobal.com/verdict with {} returned HTTP 402 with a `payment-required` header whose
    base64 payload decodes to {x402Version: 2, resource: {url, description, mimeType, serviceName},
    accepts: [{scheme: exact, network: eip155:8453, amount: "50000", asset: 0x8335...2913 (USDC), payTo:
    0x671e...834e, maxTimeoutSeconds: 300, extra: {name: USD Coin, version: "2"}}], extensions: {bazaar:
    {discoverable: true, category: security, info: {...}, schema: {...}}}}. The OpenAPI declares 402 on all
    seven paid operations. /.well-known/x402.json declares x402Version 2.
  domain_standard_signature: true
  note: >-
    The contract-level signature for agent commerce in this market — the x402 challenge was observed on the
    wire, the manifest is published at the well-known path, and the discovery feed at /discovery/resources
    follows the Bazaar shape. Settlement itself was NOT exercised (this pipeline pays nothing).
